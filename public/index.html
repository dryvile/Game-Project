<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Shooter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      background: #2b2d42;
      border: 3px solid #8d99ae;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Player controls state
  const keys = { w: false, a: false, s: false, d: false };
  const mouse = { x: 0, y: 0 };
  
  let localPlayer = { x: 400, y: 300, speed: 4 };
  let gameState = { players: {}, bullets: [] };

  // Event Listeners
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = true;
  });

  window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = false;
  });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });

  canvas.addEventListener('click', () => {
    const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
    socket.emit('shoot', {
      x: localPlayer.x,
      y: localPlayer.y,
      angle: angle
    });
  });

  // Receive game updates from server
  socket.on('stateUpdate', (state) => {
    gameState = state;
  });

  // Local game loop
  function update() {
    // Movement logic
    if (keys.w && localPlayer.y > 20) localPlayer.y -= localPlayer.speed;
    if (keys.s && localPlayer.y < canvas.height - 20) localPlayer.y += localPlayer.speed;
    if (keys.a && localPlayer.x > 20) localPlayer.x -= localPlayer.speed;
    if (keys.d && localPlayer.x < canvas.width - 20) localPlayer.x += localPlayer.speed;

    // Calculate aiming angle
    const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);

    // Send position to server
    socket.emit('playerUpdate', {
      x: localPlayer.x,
      y: localPlayer.y,
      angle: angle
    });
  }

  // Render loop
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Bullets
    ctx.fillStyle = '#ffb703';
    gameState.bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Players
    Object.keys(gameState.players).forEach(id => {
      const p = gameState.players[id];

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      // Gun
      ctx.fillStyle = '#8d99ae';
      ctx.fillRect(10, -3, 15, 6);

      // Player Body
      ctx.fillStyle = p.color || '#ef233c';
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#edf2f4';
      ctx.stroke();

      ctx.restore();
    });
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
