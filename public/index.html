<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Canvas Gun Game</title>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body {
      margin: 0;
      padding: 0;
      background: #1e1e24;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    canvas {
      background: #2b2d42;
      border: 2px solid #8d99ae;
      max-width: 100%;
      max-height: 80vh;
    }
    p { margin: 10px 0 0; font-size: 14px; color: #8d99ae; }
  </style>
</head>
<body>

<canvas id="game" width="800" height="600"></canvas>
<p>Tap/Click anywhere on screen to move and shoot!</p>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let player = { x: 400, y: 300, angle: 0, color: '#ef233c' };
  let bullets = [];
  let targets = [];

  // Spawn simple targets
  setInterval(() => {
    if (targets.length < 5) {
      targets.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: Math.random() * (canvas.height - 40) + 20
      });
    }
  }, 1500);

  function handleInput(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const targetX = (clientX - rect.left) * scaleX;
    const targetY = (clientY - rect.top) * scaleY;

    // Turn toward tap/click
    player.angle = Math.atan2(targetY - player.y, targetX - player.x);

    // Move slightly toward tap/click
    player.x += Math.cos(player.angle) * 15;
    player.y += Math.sin(player.angle) * 15;

    // Shoot bullet
    bullets.push({
      x: player.x,
      y: player.y,
      vx: Math.cos(player.angle) * 12,
      vy: Math.sin(player.angle) * 12,
      life: 60
    });
  }

  // Handle Touch and Mouse Controls
  window.addEventListener('pointerdown', (e) => handleInput(e.clientX, e.clientY));

  function update() {
    // Update Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      // Check hit target
      for (let j = targets.length - 1; j >= 0; j--) {
        let t = targets[j];
        let dist = Math.hypot(b.x - t.x, b.y - t.y);
        if (dist < 20) {
          targets.splice(j, 1);
          bullets.splice(i, 1);
          break;
        }
      }

      if (b && b.life <= 0) bullets.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Targets
    ctx.fillStyle = '#ffb703';
    targets.forEach(t => {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 15, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Bullets
    ctx.fillStyle = '#edf2f4';
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    // Gun
    ctx.fillStyle = '#8d99ae';
    ctx.fillRect(10, -4, 16, 8);

    // Body
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#edf2f4';
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
