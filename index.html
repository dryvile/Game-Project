<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Party Clicker</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f7f6; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto 20px auto; }
        input { width: 80%; padding: 12px; margin: 8px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 14px 24px; font-size: 18px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 8px; cursor: pointer; width: 85%; margin: 8px 0; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #click-btn { background-color: #28a745; height: 100px; font-size: 24px; margin-top: 15px; }
        #status { font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Party Clicker</h1>
        
        <input type="text" id="username" placeholder="Your Display Name" value="Player1">
        <input type="text" id="party-code" placeholder="Party Room Name (e.g. room123)">
        
        <div>
            <button id="host-btn">Create Party</button>
            <button id="join-btn">Join Party</button>
        </div>

        <p id="status">Status: Disconnected</p>
    </div>

    <div class="card">
        <button id="click-btn" disabled>TAP / CLICK ME!</button>
        <h3>Your Clicks: <span id="my-score">0</span></h3>
        <h3><span id="opponent-name">Opponent</span>'s Clicks: <span id="opponent-score">0</span></h3>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myScore = 0;
        let opponentScore = 0;

        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        const clickBtn = document.getElementById('click-btn');
        const statusText = document.getElementById('status');

        // Create Party (Host)
        hostBtn.addEventListener('click', () => {
            const roomCode = getRoomCode();
            if (!roomCode) return;

            peer = new Peer(roomCode);

            peer.on('open', () => {
                statusText.innerText = `Party created! Tell friend to join room: ${roomCode}`;
                statusText.style.color = "blue";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                alert('Room name already taken or invalid. Try a different room name!');
            });
        });

        // Join Party (Client)
        joinBtn.addEventListener('click', () => {
            const roomCode = getRoomCode();
            if (!roomCode) return;

            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnection();
            });
        });

        function getRoomCode() {
            const code = document.getElementById('party-code').value.trim().toLowerCase();
            if (!code) {
                alert('Please enter a Party Room Name!');
                return null;
            }
            return code;
        }

        // Connection Handler
        function setupConnection() {
            conn.on('open', () => {
                const name = document.getElementById('username').value || 'Player';
                statusText.innerText = "Connected to Party!";
                statusText.style.color = "green";
                clickBtn.disabled = false;

                // Send name to peer
                conn.send({ type: 'init', name: name });
            });

            conn.on('data', (data) => {
                if (data.type === 'init') {
                    document.getElementById('opponent-name').innerText = data.name;
                } else if (data.type === 'click') {
                    opponentScore++;
                    document.getElementById('opponent-score').innerText = opponentScore;
                }
            });
        }

        // Touch & Click Support for Mobile / PC
        function handleClick(e) {
            e.preventDefault();
            if (conn && conn.open) {
                myScore++;
                document.getElementById('my-score').innerText = myScore;
                conn.send({ type: 'click' });
            }
        }

        clickBtn.addEventListener('touchstart', handleClick);
        clickBtn.addEventListener('click', handleClick);
    </script>
</body>
</html>
